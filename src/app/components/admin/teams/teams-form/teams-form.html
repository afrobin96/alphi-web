<div class="alp-modal-backdrop" id="modalNuevoEquipo" tabindex="-1" aria-labelledby="modalNuevoEquipoLabel"
  aria-hidden="true" (click)="onClose()">
  <div class="alp-modal-box" (click)="$event.stopPropagation()">
    <div class="modal-content border-0 shadow-lg">

      <div class="modal-header border-0 pb-0 pt-4 px-4">
        <div class="d-flex align-items-center gap-3">
          <div class="p-2 rounded-3 alp-project-icon">
            <i class="bi bi-person-add fs-4"></i>
          </div>
          <div>
            <h4 class="modal-title fw-bold text-dark mb-0" id="modalNuevoEquipoLabel">{{ editing ? 'Editar' : 'Nuevo' }} Equipo</h4>
            <p class="text-muted small mb-0">{{ editing ? 'Edita' : 'Crea' }} Equipo un nuevo equipo en Alphi</p>
          </div>
        </div>
        <button type="button" class="btn-close" aria-label="Close" (click)="onClose()"></button>
      </div>

      <div class="modal-body p-4">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="d-flex flex-column gap-3">

          <!-- Campo: Nombre -->
          <div>
            <label for="equipoNombre" class="form-label small fw-semibold text-secondary mb-1">
              Nombre <span class="text-danger">*</span>
            </label>
            <input type="text" id="equipoNombre" class="form-control form-control-custom"
              placeholder="Ej. Plataforma Alphi v2.0" required formControlName="name">
            @if(form.get('name')?.invalid && form.get('name')?.touched){
            <div class="text-danger mt-1 small">
              @if (form.get('name')?.hasError('required')){
              <span>El nombre es obligatorio</span>
              }
            </div>
            }
          </div>


          <!-- Campo: Descripción -->
          <div>
            <label for="equipoDescripcion" class="form-label small fw-semibold text-secondary mb-1">
              Descripción
            </label>
            <textarea id="equipoDescripcion" class="form-control form-control-custom" rows="3"
              placeholder="Ingresa una breve descripción de los objetivos del equipo..."
              formControlName="description"></textarea>
          </div>

          <!-- Modal Actions -->
          <div class="d-flex align-items-center justify-content-start gap-3 pt-3 mt-2">
            <button type="submit" class="btn alp-btn-brand" [disabled]="form.invalid">
              <i class="bi bi-check-lg me-1"></i> Guardar
            </button>
            <button type="button" class="btn btn-link text-decoration-none text-secondary fw-semibold small"
              (click)="onClose()">
              Cancelar
            </button>
          </div>

        </form>
      </div>

    </div>
  </div>
</div>
