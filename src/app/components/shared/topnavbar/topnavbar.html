<!-- Top Navbar -->
  <header class="top-navbar d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-3">
      <button class="btn btn-light d-lg-none rounded-3" onclick="toggleSidebar()">
        <i class="bi bi-list fs-5"></i>
      </button>
      <!-- to-do hacer la barra de busqueda -->
      <div class="search-bar d-none d-sm-block">
        <i class="bi bi-search"></i>
        <input type="text" class="form-control" placeholder="Buscar proyectos, tareas...">
      </div>
    </div>

    <div class="d-flex align-items-center gap-3">
      <!-- to-do hacer notifications dropdown -->
      <div class="dropdown">
        <button class="btn btn-light rounded-circle position-relative p-2" type="button" data-bs-toggle="dropdown">
          <i class="bi bi-bell fs-6"></i>
          <span
            class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 rounded-4 p-2" style="width: 280px;">
          <li>
            <h6 class="dropdown-header fw-bold text-dark">Notificaciones</h6>
          </li>
          <li><a class="dropdown-item rounded-3 small py-2" href="#"><i class="bi bi-info-circle text-primary me-2"></i>
              Nueva tarea asignada</a></li>
          <li><a class="dropdown-item rounded-3 small py-2" href="#"><i
                class="bi bi-exclamation-triangle text-warning me-2"></i> Pago pendiente por revisar</a></li>
        </ul>
      </div>

      <div class="vr my-2 opacity-10"></div>

      <!-- User Profile -->
      <div class="d-flex align-items-center gap-2">
        <div class="rounded-circle p-2 alp-bg-white">
            <span>{{userInitials}}</span>
        </div>
        <div class="d-none d-md-block text-start" style="line-height: 1.2;">
          <span class="d-block fw-semibold text-dark small">{{user?.username}}</span>
          <small class="text-muted" style="font-size: 0.75rem;">{{user?.email}}</small>
        </div>
      </div>

      <!-- Botón Cerrar Sesión -->
      <a class="btn alp-btn-logout ms-4" (click)="logout()">
        <i class="bi bi-box-arrow-right"></i>
        <span class="d-none d-sm-inline">Cerrar sesión</span>
      </a>
    </div>
  </header>
