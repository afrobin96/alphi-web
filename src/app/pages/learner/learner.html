<mat-sidenav-container class="sidenav-container container-fluid h-100 bg-white p-0">
  <mat-sidenav #drawer class="sidenav" mode="side" [opened]="true">
    <div class="p-3 alp-navigation-menu d-flex flex-column">
      <h5 class="mb-4 alp-text-sm alp-text-main-color">Mi espacio</h5>
      <a mat-icon-button routerLink="dashboard" routerLinkActive="active">
        <mat-icon class="me-3">dashboard</mat-icon>Mi Plan
      </a>
      <a mat-icon-button routerLink="generator" routerLinkActive="active">
        <mat-icon class="me-3">auto_awesome</mat-icon>Generar PDF
      </a>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary d-flex justify-content-between bg-white border-top border-bottom">
      <div class="d-flex align-items-center">
        <button mat-icon-button (click)="drawer.toggle()"
          class="alp-btn-menu d-flex align-items-center justify-content-center alp-text-sm">
          <mat-icon>space_dashboard</mat-icon>
        </button>
        <span class="ms-4">Portal de Aprendizaje — {{ username }}</span>
      </div>
      <button class="btn btn-danger d-flex align-items-center" (click)="logout()">
        Cerrar sesión <mat-icon class="ms-2">logout</mat-icon>
      </button>
    </mat-toolbar>
    <div class="container mt-3">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
